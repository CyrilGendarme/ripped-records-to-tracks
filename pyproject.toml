[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ripped-records-to-tracks"
version = "0.1.0"
description = "Split long ripped records into probable tracks using multiple audio heuristics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "librosa>=0.10.2",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "soundfile>=0.12.1",
]

[project.scripts]
rtt-split = "src.rtt.cli:main"
